# /**/ key + relative topics: also valid inside a robot namespace (/nevo1/...).
# One input per source; the highest priority that is publishing wins.
# Output -> diff_cont/cmd_vel_unstamped_raw -> safety_fail_node -> diff_cont (TwistStamped).
/**/twist_mux:
  ros__parameters:
    use_stamped: false

    topics:
      # Nav2: controller_server and behavior_server publish cmd_vel_nav,
      # velocity_smoother turns that into cmd_vel_smoothed.
      navigation:
        topic: cmd_vel_smoothed
        timeout: 0.5
        priority: 10

      # Local teleop (teleop_twist_keyboard's default topic) overrides Nav2.
      teleop:
        topic: cmd_vel
        timeout: 0.5
        priority: 30
