# NEVO real-robot Nav2 + AMCL params (robot.launch.py sim:=false).
# = the NEVO repo's controller_mppi_params.yaml (the robot's default nav params) plus one extra
# controller, LaneFollow (Regulated Pure Pursuit): an RMF fleet adapter can send each lane
# (previous waypoint -> next waypoint) as a straight path to /<ns>/follow_path with
# controller_id LaneFollow, so NEVO stays on the drawn lane and turns on the spot at
# waypoints. FollowPath (MPPI) is unchanged for normal NavigateToPose goals.
# Topic params (topic, scan_topic, odom_topic) are moved under /<ns>/ by robot.launch.py.
#
# Speeds are matched to MPPI (vx_max 0.25, wz_max 0.5).
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.10
    alpha2: 0.05
    alpha3: 0.10
    alpha4: 0.05
    alpha5: 0.0
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 11.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 800
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    # Only update the filter after real motion (0.0 = every scan, even standing still).
    update_min_a: 0.15
    update_min_d: 0.15
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /scan_filtered
    # Publish map->odom as soon as AMCL activates, so Nav2's costmaps don't
    # race a CLI-published /initialpose during bringup.
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_cont/odom
    bt_loop_duration: 20
    default_server_timeout: 3000
    default_nav_to_pose_bt_xml: "$(find-pkg-share nevo_bot)/config/navigate_to_pose_w_relocalization.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    transform_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "LaneFollow"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # RMF lanes (see header). Values from the ORBIT sim (orbit_nevo_bringup nav2_sim.yaml),
    # speeds lowered to the real robot's MPPI limits.
    LaneFollow:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      # turn on the spot to face along the lane before driving, and to the final heading at the end
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      allow_reversing: false
      # slow down in curves and near the goal, not near walls (the lane already keeps distance)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: false
      approach_velocity_scaling_dist: 0.4
      min_approach_linear_velocity: 0.05
      # stop (not swerve) if something is on the lane ahead; the adapter then asks RMF to replan
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.5

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28
      model_dt: 0.2
      batch_size: 800
      iteration_count: 4
      motion_model: "DiffDrive"
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.5
      open_loop: true
      gamma: 0.015
      vx_max: 0.25
      vx_min: -0.12
      vy_max: 0.0
      wz_max: 0.5
      # Same limits as velocity_smoother: with open_loop MPPI assumes the robot
      # reached its last command, so its model must not be faster than the smoother.
      ax_max: 0.25
      ax_min: -0.25
      az_max: 0.5
      visualize: true
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "ObstaclesCritic", "PreferForwardCritic"]
     
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_weight: 20.0
        offset_from_endpoint: 2
      PathFollowCritic:
        enabled: true
        cost_weight: 8.0
        offset_from_endpoint: 0
      PathAngleCritic:
        enabled: true
        cost_weight: 4.0
        offset_from_endpoint: 2
      ObstaclesCritic:
        enabled: true
        cost_weight: 0.5
        repulsion_weight: 0.5
        critical_weight: 1.0
        consider_footprint: false
      PreferForwardCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 0.5
      
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"

      plugins: ["stvl_layer", "obstacle_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.20
        obstacle_max_range: 3.0
        obstacle_min_range: 0.5
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        update_footprint_enabled: true
        combination_method: 1
        observation_sources: depth_camera
        depth_camera:
          data_type: "PointCloud2"
          topic: /points
          sensor_frame: "camera_link_optical"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.5
          min_obstacle_height: 0.20
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 3
          clear_after_reading: true
          enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.20
          raytrace_max_range: 3.0
          raytrace_min_range: 0.20

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        # >= circumscribed radius of the 0.70 x 0.60 footprint (0.46 m), because
        # MPPI's ObstaclesCritic checks a circle (consider_footprint: false).
        inflation_radius: 0.50

      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      rolling_window: false
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 8.0
          obstacle_min_range: 0.20
          raytrace_max_range: 10.0
          raytrace_min_range: 0.20


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.5

      always_send_full_costmap: True # Forces RViz to render the grid reliably
      
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 5.0
    transform_tolerance: 0.5
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_stamped_vel: False
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # Synced with MPPI limits
    max_velocity: [0.25, 0.0, 0.5]
    min_velocity: [-0.12, 0.0, -0.5]
    
    # Smooth slewed acceleration
    max_accel: [0.25, 0.0, 0.5]
    max_decel: [-0.25, 0.0, -0.5]
    
    odom_topic: /diff_cont/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# lifecycle_manager_navigation: node_names are set in launch/navigation_launch.py;
# docking_server has its own lifecycle manager in launch_robot (docking:=true).
