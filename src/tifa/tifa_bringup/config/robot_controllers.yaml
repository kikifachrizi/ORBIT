# Dipakai robot fisik (ros2_control_node) DAN simulasi (gz_ros2_control).
# Prefix /**/ membuat parameter tetap terbaca bila node diberi namespace.
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/diff_cont:
  ros__parameters:
    publish_rate: 100.0
    base_frame_id: base_link

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.425
    wheel_radius: 0.0635

    # [JAZZY] use_stamped_vel dihapus: diff_drive_controller Jazzy hanya
    # subscribe ~/cmd_vel (TwistStamped). Lihat safety_fail_node.
    enable_odom_tf: false    # TF odom -> base_link dipublikasikan EKF
    odom_frame_id: odom
    pose_covariance_diagonal: [0.001, 0.001, 1e6, 1e6, 1e6, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1e6, 1e6, 1e6, 0.01]
